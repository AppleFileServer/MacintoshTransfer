<!-- The MacMusic Transfer Utility's icon (2026-10-09): the MacMusic
     Converter Utility's (a generic compact computer, its screen showing a
     1-bit note, no Apple logo), with a transfer badge, a double arrow, in
     the MacMusic manual's red (#e0442b).
     tools/make-icon.sh turns this into Resources/AppIcon.icns. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efdd"/><stop offset="1" stop-color="#d9ccae"/></linearGradient>
<linearGradient id="case" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1e9d4"/><stop offset="1" stop-color="#e2d7bb"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dde3d3"/><stop offset="1" stop-color="#c3cbb9"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
<filter id="badge" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/></filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#sh)"/>
<!-- the case, and the recessed band at its foot -->
<rect x="292" y="196" width="440" height="616" rx="40" fill="url(#case)" stroke="#8c8068" stroke-width="9"/>
<path d="M297 734 H727" stroke="#a89d83" stroke-width="7"/>
